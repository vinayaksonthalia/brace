# Brace — build & deploy recipe for Zerops.
#
# Two setups, deployed independently:
#
#   zcli push --serviceId <api service>          # from the repo root, setup: api
#   zcli push --serviceId <web service> --setup web --workingDir ./web
#
# The `api` setup compiles cmd/brace and ships a single static binary. The
# `web` setup ships the finished dashboard to the static service; run it with
# --workingDir ./web so the deployed root is the dashboard itself and
# index.html lands at /.
#
# The database credentials are NOT written here. The api service reads them
# from a `db_` reference that Zerops injects (Project settings → Environment
# variables → import from service `db`), which is why BRACE_ADMIN_URL below is
# a template over ${db_superUser} / ${db_superUserPassword} / ${db_hostname}
# rather than anything checked into git. If those references are absent the
# process falls back to composing the DSN from superUser/superUserPassword and
# the hostname `db` — see internal/boot.FromEnv.
#
# ---------------------------------------------------------------------------
# Bring your own data
#
# The stock lab seeds a synthetic ten-million-row `orders` table. That is a good
# demo and a weak rehearsal: the migration you are actually afraid of runs
# against YOUR schema, at YOUR row widths, under YOUR traffic. Two environment
# variables point a self-hosted deployment at a restored production dump
# instead — no fork, no recompile. Full walkthrough in docs/BYOD.md.
#
#   BRACE_SEED: "off"
#       Skip seeding entirely. `brace_template` is then whatever you restored
#       into it, and boot verifies it exists and has user tables rather than
#       writing to it. SEED_ROWS: "0" means the same thing.
#       If the template is missing, the process refuses to start and prints the
#       createdb/pg_restore recipe. (You do NOT need to set ALLOW_CONNECTIONS —
#       Brace pins the template to false itself on every start.)
#
#   BRACE_LOAD_LABELS: "name:weight:statement;name:weight:statement"
#       The traffic mix run against every twin, replacing the built-in one.
#       Only the first two colons in each entry are structural, so a statement
#       may contain colons; it may NOT contain a semicolon. Every statement is
#       run with exactly two bound bigints, so it must use both $1 and $2 —
#       PostgreSQL rejects a bind with more parameters than the statement
#       declares, so a $1-only statement would fail on every single write.
#       At boot each statement is executed once against a throwaway twin, so a
#       typo'd table name is a named startup error rather than a rehearsal whose
#       casualty count is quietly meaningless. Look for `byod.labels_validated`.
#       That self-check also runs when BRACE_SEED=off and this variable is NOT
#       set, because the built-in mix writes to `orders` — a table a restored
#       dump probably does not have. In practice the two variables travel
#       together.
#
# Example (uncomment and adapt under envVariables below):
#
#   BRACE_SEED: "off"
#   BRACE_LOAD_LABELS: >-
#     checkout:3:INSERT INTO invoices (customer_id, cents) VALUES ($1, $2);
#     login:2:UPDATE sessions SET last_seen = now() WHERE id = $1 % 50 AND $2 > 0
#
# Security note: these statements are executed by the lab against a disposable
# clone, under lock_timeout, on the load pool's own connections. The migration
# under test is the only thing that runs as `brace_migrator`, which is
# NOSUPERUSER and owns nothing outside the twin. Anyone who can set these
# variables already controls the deployment.
# ---------------------------------------------------------------------------

zerops:
  - setup: api
    build:
      base: go@1
      buildCommands:
        - go build -o app ./cmd/brace
      deployFiles:
        - app
    run:
      base: go@1
      ports:
        - port: 8080
          httpSupport: true
      envVariables:
        # Superuser DSN for the maintenance database. The lab needs superuser:
        # it creates and drops databases (the twins) on every run.
        BRACE_ADMIN_URL: postgres://${db_superUser}:${db_superUserPassword}@${db_hostname}:5432/postgres
        PORT: "8080"
        # Warm twins kept ready. Each one is a full copy of the template, so
        # this is the disk multiplier as much as it is the concurrency.
        POOL_SIZE: "2"
        # Concurrent writers in the simulated application.
        WORKERS: "24"
        # Template size. Ten million unindexed rows is what makes a naive
        # CREATE INDEX take long enough to be an outage rather than a blip.
        SEED_ROWS: "10000000"
        # The scale projection's denominator-in-reverse: how many rows the table
        # this migration is really destined for holds. The twin is a SAMPLE, and
        # a freeze measured on a sample is not the freeze production gets — this
        # is the number that turns "0.2s here" into "~2s on a 100M-row table"
        # and lets the projection veto a SAFE.
        #
        # A public lab has no way to know any visitor's real table size, so this
        # is Brace's stock ASSUMPTION and every projection built on it is
        # labelled as one (scale_projection.target_rows_assumed = true, and the
        # warning text says so in words). Callers who know better send
        # target_rows on the run request, or a self-hoster sets this to their
        # own number — either way the label changes with it.
        #
        # Leaving it unset does NOT disable the projection: the process falls
        # back to the same assumed 100,000,000 (boot.DefaultAssumedTargetRows).
        # It is written here so the deployment's value is visible rather than
        # implicit.
        BRACE_TARGET_ROWS: "100000000"
        # The simulated request deadline on write traffic: a write that waits
        # longer than this for its lock is counted a casualty. It is the whole
        # definition of the casualty number, which is why every result reports
        # it back as casualties.deadline_ms. Per-run override: lock_timeout_ms.
        BRACE_LOCK_TIMEOUT_MS: "1500"
        # Hostile mode, deliberately OFF here.
        #
        # With it on, Brace holds a transaction open on the load target while the
        # migration runs, so a fast DDL has to QUEUE for its AccessExclusiveLock
        # — which is the thing that actually takes production down, because every
        # statement arriving after that queued request waits behind it too.
        # It is off by default because it changes the question the run answers
        # ("this migration behind a 2s transaction" rather than "this migration"),
        # and a number that moved because of a Brace flag has to be one the caller
        # asked for. Callers turn it on per run with {"hostile": true}; a
        # deployment can default it on with BRACE_HOSTILE: "on".
        #
        # With it off, a run whose statement takes ACCESS EXCLUSIVE and measured
        # no freeze does NOT ship a bare SAFE: it carries
        # qualifier="acquisition_not_simulated" and a note saying which half of
        # the risk was measured.
        BRACE_HOSTILE: "off"
        # Per-cycle hold for hostile mode, when it is on.
        BRACE_HOSTILE_HOLD_MS: "2000"
      start: ./app
      # /healthz answers as soon as the listener is up — deliberately before
      # the template has finished seeding, which on a cold project takes
      # minutes. /api/* reports {"error":"starting","phase":...} until ready.
      healthCheck:
        httpGet:
          port: 8080
          path: /healthz

  - setup: web
    build:
      base: alpine@latest
      deployFiles: ./web/~
    run:
      os: alpine
      base: static

  # ── mcp — the remote MCP endpoint ──────────────────────────────────────────
  # A hosted Model Context Protocol server so any coding agent can crash-test a
  # migration by URL, with nothing cloned or installed:
  #   claude mcp add --transport http brace https://<mcp-subdomain>/mcp/
  # It is a thin client over the api service, reached on the PRIVATE network
  # (http://api:8080) — never the public internet.
  - setup: mcp
    build:
      base: python@3.12
      buildCommands:
        - python3 -m venv .venv
        - .venv/bin/pip install --no-cache-dir -r mcp/requirements.txt
      deployFiles:
        - mcp/server.py
        - mcp/requirements.txt
        - .venv
    run:
      base: python@3.12
      ports:
        - port: 8080
          httpSupport: true
      envVariables:
        MCP_TRANSPORT: http
        PORT: "8080"
        BRACE_API: http://api:8080
      start: .venv/bin/python mcp/server.py
